<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAuth2 con Supabase</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>OAuth2 + Supabase</h1>
      <p>Inicia sesión con credenciales válidas de GitHub o Google.</p>
      <div class="auth-options">
        <!-- Cada botón indica explícitamente el proveedor OAuth -->
        <a href="/auth/login?provider=google" class="btn">Continuar con Google</a>
        <a href="/auth/login?provider=github" class="btn btn-outline">Continuar con GitHub</a>
      </div>
    </main>
  </body>
</html>
