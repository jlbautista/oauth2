<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAuth2 con Supabase</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>OAuth2 + Supabase</h1>
      <p>Inicia sesión con credenciales válidas de GitHub o Google.</p>
      <div class="auth-options">
        <!-- Cada botón indica explícitamente el proveedor OAuth -->
        <a href="/auth/login?provider=google" class="btn-provider btn-google" aria-label="Continuar con Google">
          <span class="provider-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
              <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.5 3.9-5.5 3.9-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3.3 14.7 2.4 12 2.4A9.6 9.6 0 0 0 2.4 12c0 5.3 4.3 9.6 9.6 9.6 5.5 0 9.2-3.9 9.2-9.3 0-.6-.1-1.1-.2-1.5z"/>
              <path fill="#34A853" d="M3.5 7.9l3.2 2.3C7.5 8.2 9.6 6 12 6c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3.3 14.7 2.4 12 2.4c-3.8 0-7 2.2-8.5 5.5z"/>
              <path fill="#FBBC05" d="M12 21.6c2.6 0 4.8-.9 6.4-2.5l-3-2.4c-.8.6-1.9 1.1-3.4 1.1-3.9 0-5.3-2.6-5.5-3.9l-3.2 2.5c1.5 3.3 4.8 5.2 8.7 5.2z"/>
              <path fill="#4285F4" d="M21.2 12.3c0-.6-.1-1.1-.2-1.5H12v3.9h5.5c-.3 1.3-1.1 2.3-2.1 3l3 2.4c1.8-1.7 2.8-4.2 2.8-7.8z"/>
            </svg>
          </span>
          <span>Continuar con Google</span>
        </a>
        <a href="/auth/login?provider=github" class="btn-provider btn-github" aria-label="Continuar con GitHub">
          <span class="provider-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
              <path fill="currentColor" d="M12 .5C5.6.5.5 5.7.5 12.1c0 5.1 3.3 9.4 7.8 10.9.6.1.8-.3.8-.6v-2.3c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.8 1.2 1.8 1.2 1 .1.6 2.4 3.3 1.7.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 .1.9-.2 1.9-.3 2.9-.3s2 .1 2.9.3c2.1-.5 3-.1 3-.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.2-2.6 5.2-5.1 5.5.4.4.8 1.1.8 2.2v3.3c0 .4.2.8.8.6 4.5-1.5 7.8-5.8 7.8-10.9C23.5 5.7 18.4.5 12 .5z"/>
            </svg>
          </span>
          <span>Continuar con GitHub</span>
        </a>
      </div>
    </main>
  </body>
</html>
